<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2433"/>
      <stop offset="1" stop-color="#3a3045"/>
    </linearGradient>
    <pattern id="stripes" width="48" height="560" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="24" height="560" fill="#ffffff" fill-opacity="0.025"/>
      <rect x="35" y="0" width="2" height="560" fill="#241e2b" fill-opacity="0.35"/>
    </pattern>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3324"/>
      <stop offset="1" stop-color="#6a4a33"/>
    </linearGradient>
    <linearGradient id="floorShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f1820" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1f1820" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151a33"/>
      <stop offset="1" stop-color="#2e3660"/>
    </linearGradient>
    <radialGradient id="pool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd59a" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffd59a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f3e6c4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f3e6c4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- wall -->
  <rect x="0" y="0" width="1600" height="560" fill="url(#wall)"/>
  <rect x="0" y="0" width="1600" height="560" fill="url(#stripes)"/>

  <!-- floor -->
  <rect x="0" y="572" width="1600" height="328" fill="url(#floor)"/>
  <g stroke="#3d2a1d" stroke-width="2" fill="none">
    <path d="M-280 572 L-1240 900 M-200 572 L-1060 900 M-120 572 L-880 900 M-40 572 L-700 900 M40 572 L-520 900 M120 572 L-340 900 M200 572 L-160 900 M280 572 L20 900 M360 572 L200 900 M440 572 L380 900 M520 572 L560 900 M600 572 L740 900 M680 572 L920 900 M760 572 L1100 900 M840 572 L1280 900 M920 572 L1460 900 M1000 572 L1640 900 M1080 572 L1820 900 M1160 572 L2000 900 M1240 572 L2180 900 M1320 572 L2360 900 M1400 572 L2540 900 M1480 572 L2720 900 M1560 572 L2900 900"/>
  </g>
  <g stroke="#3d2a1d" stroke-width="2" fill="none" stroke-opacity="0.8">
    <path d="M90 610 L76 610 M330 610 L320 610 M570 640 L568 640 M140 650 L118 650 M410 600 L404 600 M690 610 L696 610 M930 630 L948 630 M1210 605 L1224 605 M1450 640 L1484 640 M1060 690 L1090 690 M780 700 L796 700 M480 720 L472 720 M180 700 L146 700 M1320 760 L1380 760 M1530 700 L1580 700 M960 820 L1000 820 M300 840 L270 840 M1180 870 L1240 870"/>
  </g>
  <rect x="0" y="572" width="1600" height="40" fill="url(#floorShade)"/>

  <!-- skirting -->
  <rect x="0" y="556" width="1600" height="16" fill="#5a3e2b"/>
  <rect x="0" y="556" width="1600" height="3" fill="#7a5638"/>
  <rect x="0" y="570" width="1600" height="2" fill="#3f2b1e"/>

  <!-- window -->
  <rect x="600" y="80" width="280" height="220" fill="#5a3e2b"/>
  <rect x="604" y="84" width="272" height="212" fill="#7a5638"/>
  <rect x="616" y="96" width="248" height="188" fill="url(#sky)"/>
  <circle cx="808" cy="138" r="34" fill="url(#moonGlow)"/>
  <circle cx="808" cy="138" r="20" fill="#f3e6c4"/>
  <circle cx="801" cy="132" r="4" fill="#e2d2aa"/>
  <circle cx="814" cy="146" r="3" fill="#e2d2aa"/>
  <g fill="#f6efd9">
    <circle cx="640" cy="118" r="1.6"/>
    <circle cx="676" cy="150" r="1.2"/>
    <circle cx="704" cy="112" r="1.8"/>
    <circle cx="660" cy="214" r="1.3"/>
    <circle cx="712" cy="248" r="1.1"/>
    <circle cx="772" cy="224" r="1.5"/>
    <circle cx="846" cy="206" r="1.2"/>
    <circle cx="838" cy="262" r="1.6"/>
    <circle cx="764" cy="120" r="1.1"/>
    <circle cx="632" cy="262" r="1"/>
  </g>
  <rect x="736" y="96" width="8" height="188" fill="#7a5638"/>
  <rect x="616" y="186" width="248" height="8" fill="#7a5638"/>
  <rect x="616" y="96" width="248" height="4" fill="#5a3e2b" opacity="0.6"/>
  <rect x="588" y="296" width="304" height="12" rx="2" fill="#a27b52"/>
  <rect x="592" y="308" width="296" height="5" fill="#5a3e2b"/>

  <!-- curtains -->
  <rect x="556" y="62" width="368" height="6" rx="3" fill="#5a3e2b"/>
  <circle cx="556" cy="65" r="6" fill="#7a5638"/>
  <circle cx="924" cy="65" r="6" fill="#7a5638"/>
  <path d="M566 68 L612 68 Q604 190 616 316 L562 316 Q570 190 566 68 Z" fill="#3f6b6b"/>
  <path d="M578 70 Q584 190 576 314 M596 70 Q594 190 600 314" stroke="#345a5a" stroke-width="3" fill="none"/>
  <path d="M914 68 L868 68 Q876 190 864 316 L918 316 Q910 190 914 68 Z" fill="#3f6b6b"/>
  <path d="M902 70 Q896 190 904 314 M884 70 Q886 190 880 314" stroke="#345a5a" stroke-width="3" fill="none"/>

  <!-- small framed picture, far left -->
  <rect x="212" y="168" width="128" height="96" fill="#5a3e2b"/>
  <rect x="220" y="176" width="112" height="80" fill="#c7b48f"/>
  <path d="M220 256 L262 214 L290 236 L310 220 L332 240 L332 256 Z" fill="#3f6b6b"/>
  <circle cx="306" cy="196" r="8" fill="#c79a3e"/>

  <!-- rug -->
  <ellipse cx="690" cy="798" rx="330" ry="95" fill="#1f1820" opacity="0.3"/>
  <ellipse cx="690" cy="790" rx="330" ry="95" fill="#c79a3e"/>
  <ellipse cx="690" cy="790" rx="316" ry="88" fill="#3f6b6b"/>
  <ellipse cx="690" cy="790" rx="276" ry="72" fill="none" stroke="#c79a3e" stroke-width="3" stroke-dasharray="14 10"/>
  <ellipse cx="690" cy="790" rx="236" ry="58" fill="#4a7878"/>
  <ellipse cx="690" cy="790" rx="150" ry="36" fill="none" stroke="#c79a3e" stroke-width="4"/>
  <ellipse cx="690" cy="790" rx="70" ry="16" fill="#355b5b"/>

  <!-- warm light pool -->
  <ellipse cx="700" cy="740" rx="640" ry="170" fill="url(#pool)"/>
</svg>
