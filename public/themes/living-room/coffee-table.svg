<svg xmlns="http://www.w3.org/2000/svg" width="200" height="90" viewBox="0 0 200 90">
  <defs>
    <linearGradient id="copper" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f4f2c"/>
      <stop offset="0.35" stop-color="#d98d5a"/>
      <stop offset="1" stop-color="#9c5832"/>
    </linearGradient>
  </defs>
  <!-- floor shadow -->
  <ellipse cx="100" cy="86" rx="94" ry="4" fill="#1f1820" opacity="0.35"/>
  <!-- back legs -->
  <g fill="#4a3323">
    <rect x="28" y="60" width="6" height="18"/>
    <rect x="166" y="60" width="6" height="18"/>
  </g>
  <!-- lower shelf -->
  <rect x="16" y="72" width="168" height="5" fill="#5a3e2b"/>
  <!-- front legs -->
  <g fill="#5a3e2b">
    <rect x="10" y="62" width="9" height="25"/>
    <rect x="181" y="62" width="9" height="25"/>
  </g>
  <!-- top -->
  <path d="M22 38 L178 38 L196 54 L4 54 Z" fill="#a27b52"/>
  <path d="M30 41 L170 41" stroke="#b58c62" stroke-width="2"/>
  <rect x="4" y="54" width="192" height="10" rx="2" fill="#7a5638"/>
  <rect x="4" y="54" width="192" height="2" fill="#8c6644"/>

  <!-- mug left -->
  <path d="M30 40 L44 40 L43 53 L31 53 Z" fill="#c79a3e"/>
  <ellipse cx="37" cy="40" rx="7" ry="2" fill="#5a3e2b"/>
  <path d="M44 43 Q50 44 49 47 Q48 50 43.5 50" stroke="#c79a3e" stroke-width="2" fill="none"/>
  <!-- mug right -->
  <path d="M152 41 L166 41 L165 54 L153 54 Z" fill="#3f6b6b"/>
  <ellipse cx="159" cy="41" rx="7" ry="2" fill="#5a3e2b"/>
  <path d="M152 44 Q146 45 147 48 Q148 51 152.5 51" stroke="#3f6b6b" stroke-width="2" fill="none"/>

  <!-- kettle -->
  <ellipse cx="100" cy="51" rx="24" ry="3" fill="#5a3e2b" opacity="0.5"/>
  <path d="M84 30 Q72 28 64 18 L61 20 Q68 34 80 42 Z" fill="#9c5832"/>
  <path d="M100 6 Q114 6 114 22" stroke="#5a3e2b" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M100 6 Q86 6 86 22" stroke="#5a3e2b" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M86 22 L114 22 Q126 34 122 46 Q120 51 112 51 L88 51 Q80 51 78 46 Q74 34 86 22 Z" fill="url(#copper)"/>
  <ellipse cx="100" cy="22" rx="14" ry="3.5" fill="#8f4f2c"/>
  <circle cx="100" cy="18" r="3" fill="#5a3e2b"/>
  <path d="M86 30 Q83 38 85 46" stroke="#f2c49a" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.7"/>
  <!-- steam -->
  <g stroke="#f3e6c4" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.45">
    <path d="M61 15 Q56 10 61 6 Q65 3 60 0"/>
    <path d="M54 17 Q50 13 53 9"/>
  </g>
